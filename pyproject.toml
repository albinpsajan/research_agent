[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hackathoniq"
version = "1.0.0"
description = "Autonomous Multi-Agent Hackathon Intelligence System"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.3.0",
    "ollama>=0.5.0",
    "streamlit>=1.40.0",
    "pydantic>=2.10.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.0",
    "aiosqlite>=0.21.0",
    "aiohttp>=3.11.0",
    "pypdf>=5.0.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "pytest-cov>=6.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["unit: Unit tests", "integration: Integration tests", "e2e: End-to-end tests"]
